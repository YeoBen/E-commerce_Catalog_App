<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoostorderCatalog</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="BoostorderCatalogClient.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
    <script>
        window.initSwipeToRemove = function (containerId, dotNetHelper) {
            const container = document.getElementById(containerId);
            if (!container) return;

            let startX = 0;
            let currentRow = null;
            const threshold = 60;

            container.addEventListener('touchstart', e => {
                currentRow = e.target.closest('.cart-row');
                if (currentRow) startX = e.touches[0].clientX;
            });

            container.addEventListener('touchmove', e => {
                if (!currentRow) return;
                const deltaX = e.touches[0].clientX - startX;
                if (deltaX < 0) {
                    currentRow.style.transform = `translateX(${Math.max(deltaX, -100)}px)`;
                }
            });

            container.addEventListener('touchend', e => {
                if (!currentRow) return;
                const deltaX = e.changedTouches[0].clientX - startX;
                if (deltaX < -threshold) {
                    const productId = parseInt(currentRow.dataset.productId);
                    const uom = currentRow.dataset.uom;
                    dotNetHelper.invokeMethodAsync('OnSwipeRemove', productId, uom);
                }
                currentRow.style.transform = '';
                currentRow = null;
            });
        };
    </script>
</body>

</html>
